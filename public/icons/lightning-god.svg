<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Background Aura Hexagon -->
  <polygon points="24,3 41,12 41,36 24,45 7,36 7,12" fill="#1e1b4b" stroke="#eab308" stroke-width="1.5" />
  <!-- Lightning Bolt -->
  <polygon points="26,6 12,25 23,25 19,42 36,21 25,21" fill="url(#boltGrad)" stroke="#78350f" stroke-width="1.2" filter="url(#boltGlow)" />
  <!-- Sparkles -->
  <circle cx="34" cy="14" r="1.5" fill="#fde047" />
  <circle cx="14" cy="34" r="1.5" fill="#fde047" />
</svg>
