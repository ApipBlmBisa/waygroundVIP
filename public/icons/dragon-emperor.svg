<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <filter id="dragonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Shield Emblem Frame -->
  <polygon points="24,4 42,12 36,36 24,44 12,36 6,12" fill="#1c0505" stroke="#ef4444" stroke-width="2" filter="url(#dragonGlow)" />
  <!-- Dragon Horns & Head -->
  <path d="M24 14 L28 20 L36 12 L32 26 L36 32 L24 28 L12 32 L16 26 L12 12 L20 20 Z" fill="url(#dragonGrad)" stroke="#fee2e2" stroke-width="1.2" />
  <!-- Piercing Eyes -->
  <circle cx="20" cy="24" r="2" fill="#facc15" />
  <circle cx="28" cy="24" r="2" fill="#facc15" />
  <circle cx="20" cy="24" r="0.8" fill="#000000" />
  <circle cx="28" cy="24" r="0.8" fill="#000000" />
  <!-- Flame Whiskers -->
  <path d="M24 30 L22 36 M24 30 L26 36" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" />
</svg>
