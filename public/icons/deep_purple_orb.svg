<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF" />
      <stop offset="30%" stop-color="#C084FC" />
      <stop offset="70%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
    <radialGradient id="nebulaCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E879F9" />
      <stop offset="80%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </radialGradient>
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#0B0314" stroke="url(#purpleGrad)" stroke-width="2" />
  <!-- Cosmic Galaxy Rings -->
  <ellipse cx="32" cy="32" rx="24" ry="10" transform="rotate(-30 32 32)" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.85" filter="url(#purpleGlow)" />
  <ellipse cx="32" cy="32" rx="24" ry="10" transform="rotate(30 32 32)" stroke="url(#purpleGrad)" stroke-width="2" opacity="0.85" filter="url(#purpleGlow)" />
  <!-- Singularity Core -->
  <circle cx="32" cy="32" r="12" fill="url(#nebulaCore)" filter="url(#purpleGlow)" />
  <circle cx="32" cy="32" r="4" fill="#FFFFFF" />
</svg>
