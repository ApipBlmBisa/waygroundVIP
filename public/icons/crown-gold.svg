<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Crown Base Arc -->
  <path d="M6 35 L42 35 L39 41 L9 41 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Crown Peaks -->
  <path d="M6 35 L10 16 L18 26 L24 10 L30 26 L38 16 L42 35 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.4" stroke-linejoin="round" filter="url(#goldGlow)" />
  <!-- Central Jewel -->
  <circle cx="24" cy="10" r="3.2" fill="url(#rubyGrad)" stroke="#fff" stroke-width="1" />
  <circle cx="10" cy="16" r="2.4" fill="#38bdf8" stroke="#fff" stroke-width="0.8" />
  <circle cx="38" cy="16" r="2.4" fill="#38bdf8" stroke="#fff" stroke-width="0.8" />
  <!-- Base Trim Jewels -->
  <circle cx="16" cy="38" r="1.8" fill="url(#rubyGrad)" />
  <circle cx="24" cy="38" r="2.2" fill="#38bdf8" />
  <circle cx="32" cy="38" r="1.8" fill="url(#rubyGrad)" />
</svg>
