<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="40%" stop-color="#22D3EE" />
      <stop offset="80%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#030712" stroke="url(#cyanGrad)" stroke-width="2" />
  <!-- Cyber Hexagon & Circuit lines -->
  <polygon points="32,13 49,23 49,41 32,51 15,41 15,23" fill="#082F49" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#cyanGlow)" />
  <polygon points="32,19 43,26 43,38 32,45 21,38 21,26" fill="#020617" stroke="#38BDF8" stroke-width="1" />
  <!-- Circuit Nodes -->
  <line x1="32" y1="6" x2="32" y2="13" stroke="#22D3EE" stroke-width="2" />
  <line x1="32" y1="51" x2="32" y2="58" stroke="#22D3EE" stroke-width="2" />
  <line x1="6" y1="32" x2="15" y2="32" stroke="#22D3EE" stroke-width="2" />
  <line x1="49" y1="32" x2="58" y2="32" stroke="#22D3EE" stroke-width="2" />
  <circle cx="32" cy="32" r="5" fill="#E0F2FE" />
  <circle cx="32" cy="32" r="3" fill="#06B6D4" />
</svg>
