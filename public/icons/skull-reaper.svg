<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="purpleReaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <filter id="reaperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Hood Shape -->
  <path d="M24 4 C14 4 8 16 8 28 C8 38 12 44 24 44 C36 44 40 38 40 28 C40 16 34 4 24 4 Z" fill="url(#purpleReaper)" stroke="#d8b4fe" stroke-width="1.5" filter="url(#reaperGlow)" />
  <!-- Shadow Face -->
  <ellipse cx="24" cy="27" rx="11" ry="12" fill="#090111" />
  <!-- Glowing Eyes -->
  <path d="M19 23 L22 25 L18 27 Z" fill="#22d3ee" filter="url(#reaperGlow)" />
  <path d="M29 23 L26 25 L30 27 Z" fill="#22d3ee" filter="url(#reaperGlow)" />
  <!-- Nose Triangle -->
  <polygon points="24,28 22.5,31 25.5,31" fill="#c084fc" />
  <!-- Teeth Lines -->
  <path d="M20 34 L20 37 M24 34 L24 37 M28 34 L28 37" stroke="#c084fc" stroke-width="1.4" stroke-linecap="round" />
</svg>
