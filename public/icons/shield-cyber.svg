  <!-- Shield Body -->
  <path d="M24 4 L40 10 L40 24 C40 34 33 42 24 45 C15 42 8 34 8 24 L8 10 Z" fill="url(#cyberShield)" stroke="url(#neonCyan)" stroke-width="2" filter="url(#cyanGlow)" />
